project: Reverse Solitaire
version: 0.1.8

non_negotiable_invariants:
  - A standard 52-card deck is used.
  - Cards are dealt into piles of 6 cards, with the final pile allowed to be smaller.
  - With 52 cards the normal deal is 8 piles of 6 cards plus a final pile of 4 cards.
  - Cards in each pile initially alternate face-up and face-down.
  - Flipping a pile is a physical 180-degree top-to-bottom turnover around a horizontal hinge, not an in-place mirror or squash/re-expand effect.
  - A downward flip must move the whole packet to the lower side of the hinge; the next upward flip must move it back to the upper side.
  - The visible vertical order after a turnover must be the exact reverse of the visible order before it.
  - In the four-card reference case, the free-end/bottom 9-diamond becomes the visual top, the prior third card becomes second, J-heart becomes third, and the prior first card becomes the visual bottom.
  - Do not preserve an old logical top by switching to the opposite list end; the spatial 180-degree motion determines the visible stack order.
  - After a turnover, all cards in that packet must show their rank and suit; cards that were backs become readable and cards already showing a face remain readable.
  - The flip direction alternates down then up according to the packet's current physical side.
  - At approximately 90 degrees the packet becomes edge-on at the hinge; physical-side state changes should occur at that visually hidden midpoint.
  - Animation rendering must not expose an empty canvas between frames; build the next frame before discarding the previous one.
  - Only the physically exposed free-end card of a pile can be selected for removal.
  - Before the first turnover an exposed card may still be face-down and selectable by memory.
  - Two exposed cards may be removed only when their ranks match; suits do not need to match.
  - A matching pair is removed automatically when the second card is selected.
  - The game is won only when all cards have been removed.
  - The player may give up at any time before winning.

change_policy:
  - Preserve these invariants unless the user explicitly changes the game rules.
  - Keep game-rule logic in src/reverse_solitaire/model.py testable independently from the GUI.
  - Run check_harness.cmd (or python -m pytest tests) after source changes.
