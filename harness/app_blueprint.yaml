project: Reverse Solitaire
version: 0.1.3

non_negotiable_invariants:
  - A standard 52-card deck is used.
  - Cards are dealt into piles of 5 cards, with the final pile allowed to be smaller.
  - Cards in each pile alternate face-up and face-down from bottom to top.
  - Flipping a pile reverses card order and toggles every card face state.
  - After a flip, the card that was at the bottom becomes the new top card.
  - The flip animation is vertical/top-to-bottom like a domino falling over, not a left/right rotation.
  - Animation rendering must not expose an empty canvas between frames; build the next frame before discarding the previous one.
  - Only the top card of a pile can be selected.
  - A top card may be selected even while face-down; the player may rely on memory.
  - Two top cards may be removed only when their ranks match; suits do not need to match.
  - A matching pair is removed automatically when the second card is selected.
  - The game is won only when all cards have been removed.
  - The player may give up at any time before winning.

change_policy:
  - Preserve these invariants unless the user explicitly changes the game rules.
  - Keep game-rule logic in src/reverse_solitaire/model.py testable independently from the GUI.
  - Run check_harness.cmd (or python -m pytest tests) after source changes.
