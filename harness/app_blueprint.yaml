project: Reverse Solitaire
version: 0.1.19

non_negotiable_invariants:
  - A standard 52-card deck is used.
  - Cards are dealt into piles of 6 cards, with the final pile allowed to be smaller.
  - With 52 cards the normal deal is 8 piles of 6 cards plus a final pile of 4 cards.
  - Cards in each pile initially alternate face-up and face-down.
  - Easy mode must use the same 52-card deck and normal pile sizes.
  - In easy mode, no pile may contain two cards of the same rank; therefore no same-rank pair exists inside a pile.
  - In standard mode, any one pile may contain at most one duplicated-rank pair; triples and two different duplicated-rank pairs in the same pile are forbidden.
  - In standard mode, if a duplicated-rank pair exists in a pile, at least two other cards must lie between the two equal-rank cards (index distance at least 3).
  - Flipping a pile is a physical top-to-bottom turnover around a horizontal hinge, not an in-place mirror or squash/re-expand effect.
  - A downward flip must move the whole packet to the lower side of the hinge; the next upward flip must move it back to the upper side.
  - Every flip reverses the cards' visual top-to-bottom order.
  - Every flip also toggles every individual card face state: a visible rank/suit becomes the card-back pattern, and a card-back pattern becomes a visible rank/suit.
  - In the four-card reference case A-club face / back / 9-heart face / back becomes the old fourth card face / 9-heart back / old second card face / A-club back after the downward flip.
  - With the normal alternating deal, the new top card after a downward flip must have its rank and suit visible so the removal target is identifiable.
  - A second flip reverses order and toggles all faces again, restoring the previous order and face states (except for cards already removed).
  - The visually first card is the removal-target card.
  - Face-up cards must show rank/suit at both the upper-left and lower-right so overlapped cards remain identifiable from the exposed lower edge.
  - Card overlap spacing must leave enough of the lower edge exposed to distinguish adjacent ranks such as 8 and 9.
  - The lower-right rank/suit marking must be inset enough to avoid being obscured by the centered flip control.
  - The flip control for each pile must stay at the same position for upward and downward turnovers of that pile.
  - The flip control should be centered on the turnover hinge, midway between the pile's upper-side and lower-side resting positions, so the packet crosses the control row during the animation.
  - The flip control height must remain compact enough to minimize overlap with card markings while remaining clickable.
  - The turnover animation should feel quick and rhythmic; its nominal duration should stay under 220 ms while preserving the midpoint order/face transition.
  - Mismatch feedback must use a restrained short sound and remain less prominent than normal interaction sounds.
  - Clearing all cards must trigger a visible finale before the final result dialog.
  - The finale must include a short celebratory fanfare generated without requiring an external audio asset.
  - Finale audio must stay quieter than mismatch feedback so it does not overwhelm the visual finish.
  - The user-visible mute toggle is a master audio switch: while enabled, no BGM or sound effect may start.
  - Enabling mute while audio is already playing must stop that audio immediately.
  - All present and future game audio must pass through the same master-mute gate.
  - User-facing dialogs used by gameplay must be application-drawn rather than Windows MessageBox dialogs so mute mode cannot leak Windows notification sounds.
  - The hint control may report only whether at least one currently removable top-card rank pair exists; it must not reveal which piles form the pair.
  - Hint detection must consider the current visual top card of every non-empty pile, including a face-down top card that is selectable by memory.
  - Undo is one-level only and must restore the complete previous state for the most recent flip, successful pair removal, or give-up action.
  - Undo must restore cards, card face states, pile side, move count, removed-pair count, and finished state consistently.
  - Starting a new game clears the undo history.
  - A Windows standalone build must be producible as one GUI executable named ReverseSolitaire.exe.
  - The standalone executable must not require Python, source files, WAV files, or other application files to be copied beside it on the destination Windows PC.
  - The flip direction alternates down then up according to the packet's current physical side.
  - At approximately 90 degrees the packet becomes edge-on at the hinge; order/face-state changes should occur at that visually hidden midpoint.
  - Animation rendering must not expose an empty canvas between frames; build the next frame before discarding the previous one.
  - A removal-target card may be face-down and selectable by memory when that state occurs.
  - Two removal-target cards may be removed only when their ranks match; suits do not need to match.
  - A matching pair is removed automatically when the second card is selected.
  - The game is won only when all cards have been removed.
  - The player may give up at any time before winning.

change_policy:
  - Preserve these invariants unless the user explicitly changes the game rules.
  - Keep game-rule logic in src/reverse_solitaire/model.py testable independently from the GUI.
  - Run check_harness.cmd (or python -m pytest tests) after source changes.
  - For release builds, run build_exe.cmd and smoke-test dist/ReverseSolitaire.exe on Windows.
