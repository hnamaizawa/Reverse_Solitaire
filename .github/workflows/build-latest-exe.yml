name: Build Latest Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latest-windows-exe
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run regression tests
        shell: pwsh
        run: python -m pytest tests

      - name: Build single-file EXE
        shell: cmd
        run: build_exe.cmd

      - name: Verify EXE and generate SHA-256
        shell: pwsh
        run: |
          $exe = "dist/ReverseSolitaire.exe"
          if (-not (Test-Path $exe)) {
            throw "dist/ReverseSolitaire.exe was not created."
          }
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          "$hash  ReverseSolitaire.exe" | Out-File -FilePath "dist/ReverseSolitaire.exe.sha256" -Encoding ascii
          Get-Item $exe | Format-List Name,Length,LastWriteTime
          Get-Content "dist/ReverseSolitaire.exe.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ReverseSolitaire-latest
          path: |
            dist/ReverseSolitaire.exe
            dist/ReverseSolitaire.exe.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download workflow artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ReverseSolitaire-latest
          path: dist

      - name: Replace Latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/ReverseSolitaire.exe dist/ReverseSolitaire.exe.sha256 \
            --target "$TARGET_SHA" \
            --title "Latest Reverse Solitaire" \
            --notes "Automatically built from main at commit $TARGET_SHA. Verify the downloaded EXE using the accompanying SHA-256 file." \
            --latest

      - name: Show stable download URL
        run: |
          echo "Release page: https://github.com/${{ github.repository }}/releases/latest"
          echo "Direct download: https://github.com/${{ github.repository }}/releases/download/latest/ReverseSolitaire.exe"
